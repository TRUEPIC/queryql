name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash enables pipefail so tee cannot hide test failures.
    shell: bash

jobs:
  lint-test:
    name: Lint & test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
        include:
          - node-version: '26.x'
            is-primary: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Run lint
        if: matrix.is-primary
        run: npm run lint
      - name: Run tests
        if: ${{ !matrix.is-primary }}
        run: npm test -- --ci --runInBand
      - name: Run tests with coverage
        id: coverage
        if: matrix.is-primary
        run: |
          npm test -- --ci --coverage --runInBand 2>&1 |
            tee "$RUNNER_TEMP/tests.txt"
      # Reported in its own step so the summary is still written when the suite
      # fails, which is when the test results are most worth reading.
      - name: Report test results & coverage
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: |
          {
            echo '## Tests'
            echo
            echo '```'
            grep -E '^(Test Suites|Tests|Snapshots|Time):' "$RUNNER_TEMP/tests.txt"
            echo '```'
            echo
            echo '## Test coverage'
            echo
            echo '```'
            awk '/^-+\|/ { f = 1 } /^Test Suites:/ { f = 0 } f' "$RUNNER_TEMP/tests.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: ${{ !cancelled() && hashFiles('test/reports/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name:
            test-reports-${{ matrix.node-version }}-${{ github.run_attempt }}
          path: test/reports
          retention-days: 14
      - name: Upload test coverage
        if: ${{ !cancelled() && hashFiles('test/coverage/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage-${{ github.run_attempt }}
          path: test/coverage
          retention-days: 14
